<title>Boom Boom Banana-choo!</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a sky-blue frame around one white paper. Tool rail on the left, palette strip below.
   On phones the rail becomes a scrolling row under the paper. Single bright look by choice. */
:root {
  --ink: #1c1b3a;
  --sky: #46b5ff;
  --sun: #ffd23f;
  --cherry: #ff4f6d;
  --mint: #35d6a0;
  --grape: #7a4dff;
  --white: #ffffff;
  --cur: #ff3b3b;
  --font: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.38) 1.6px, transparent 2.2px) 0 0 / 22px 22px, var(--sky);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
svg { display: block; }
.ic { width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top" "tools stage" "bottom bottom";
  gap: 10px 14px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* header */
.top { grid-area: top; display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand { flex: 1; min-width: 0; }
.logo { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.05; letter-spacing: .01em; }
.logo .w { display: inline-block; white-space: nowrap; margin-right: .28em; }
.tagline { margin: 4px 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: .02em; color: var(--ink); }
.logo span { display: inline-block; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); transition: transform .15s; }
.logo span:hover { transform: translateY(-3px) rotate(-4deg); }
.actions { display: flex; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 52px; height: 52px; padding: 0 10px;
  background: var(--white); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink);
  font-size: 15px; font-weight: 600;
  transition: transform .06s, box-shadow .06s;
}
.btn .ic { width: 28px; height: 28px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:active { transform: none; box-shadow: 0 4px 0 var(--ink); }
.btn.boom { background: var(--cherry); }
.btn:focus-visible, .swatch:focus-visible, .tool:focus-visible, .stampb:focus-visible { outline: 4px solid var(--grape); outline-offset: 2px; }

/* tool rail */
.tools {
  grid-area: tools;
  display: grid; grid-template-columns: repeat(2, 78px); grid-auto-rows: 66px;
  gap: 9px; align-content: start;
  overflow-y: auto; padding: 2px 6px 8px 2px;
  scrollbar-width: thin;
}
.tool {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: var(--white); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink); padding: 2px 0 0;
  font-size: 12px; font-weight: 600; line-height: 1.1;
  transition: transform .06s, box-shadow .06s;
}
.tool .ic { width: 32px; height: 32px; }
.tool .em { font-size: 28px; line-height: 32px; height: 32px; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tool[aria-pressed="true"] { background: var(--sun); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

/* stage */
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
.paper {
  position: absolute; inset: 0 6px 6px 0;
  background: var(--white);
  border: 4px solid var(--ink); border-radius: 18px;
  box-shadow: 6px 6px 0 var(--ink);
  overflow: hidden;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.hint {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 24px); text-align: center;
  background: var(--sun); border: 3px solid var(--ink); border-radius: 999px;
  padding: 6px 16px; font-weight: 600; font-size: 16px; pointer-events: none;
  box-shadow: 0 3px 0 var(--ink);
}
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.paper.boom { animation: shake .45s; }
.paper.boom .flash { animation: flash .45s; }
@keyframes shake { 0%,100% { transform: none; } 15% { transform: translate(-8px, 5px) rotate(-.6deg); } 35% { transform: translate(8px, -6px) rotate(.6deg); } 55% { transform: translate(-6px, -4px); } 75% { transform: translate(5px, 4px); } }
@keyframes flash { 0% { opacity: .95; background: var(--sun); } 100% { opacity: 0; } }

.tray {
  position: absolute; left: 10px; right: 16px; bottom: 16px; z-index: 5;
  background: var(--white); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--ink); padding: 10px; max-height: 58%; overflow: auto;
}
.tray h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
.grid-stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
.stampb {
  height: 58px; background: #fff; border: 2.5px solid var(--ink); border-radius: 14px;
  font-size: 32px; line-height: 1; padding: 0;
  font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.stampb[aria-pressed="true"] { background: var(--sun); }
.stampb:active { transform: scale(.94); }
.grid-fx { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.fx { height: 54px; background: var(--white); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); font-size: 16px; font-weight: 600; }
.fx:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.fx:nth-child(1) { background: #d9ccff; } .fx:nth-child(2) { background: #ffd9a8; } .fx:nth-child(3) { background: #c2f0dc; } .fx:nth-child(4) { background: #bfe6ff; } .fx:nth-child(5) { background: #ffc7d3; }

/* bottom bar */
.bottom { grid-area: bottom; display: flex; align-items: center; gap: 14px; min-width: 0; }
.opts { display: flex; align-items: center; gap: 8px; flex: none; }
.size {
  width: 52px; height: 52px; display: grid; place-items: center;
  background: var(--white); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 0;
}
.size i { display: block; background: var(--cur); border: 2.5px solid var(--ink); border-radius: 50%; }
.size[aria-pressed="true"] { background: var(--sun); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.size:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.mirror { min-width: 112px; }
.mirror[data-on="true"] { background: #d9ccff; }

.palette {
  flex: 1; min-width: 0;
  display: grid; grid-template-rows: repeat(2, 46px); grid-auto-flow: column; grid-auto-columns: 46px; gap: 7px;
  overflow-x: auto; padding: 8px 8px 10px; scrollbar-width: thin;
}
.swatch {
  width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); padding: 0;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s;
}
.swatch[aria-pressed="true"] { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
.swatch.custom { position: relative; background: conic-gradient(#ff3b3b, #ffd23f, #1fbf4a, #2cb8ff, #a23dff, #ff3b3b); overflow: hidden; }
.swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatch.custom:focus-within { outline: 4px solid var(--grape); outline-offset: 2px; }

/* photo dialog */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(28,27,58,.72); display: grid; place-items: center; padding: 16px; }
.card { background: var(--white); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); padding: 14px; max-width: min(94vw, 720px); max-height: 94%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card img { max-width: 100%; max-height: 58vh; border: 3px solid var(--ink); border-radius: 12px; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; background: #fff; }
.card p { margin: 0; font-size: 16px; font-weight: 500; text-align: center; max-width: 36ch; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "top" "stage" "tools" "bottom"; gap: 8px; }
  .top { flex-wrap: wrap; row-gap: 8px; }
  .brand { flex: 1 1 100%; }
  .actions { width: 100%; justify-content: space-between; }
  .logo { font-size: 24px; }
  .tagline { font-size: 14px; margin-top: 2px; }
  .btn .lbl { display: none; }
  .btn { min-width: 46px; height: 46px; padding: 0 8px; }
  .actions { gap: 6px; }
  .tools { display: flex; overflow-x: auto; overflow-y: hidden; padding: 2px 4px 8px; gap: 8px; }
  .tool { flex: 0 0 64px; height: 62px; font-size: 11px; }
  .bottom { flex-direction: column; align-items: stretch; gap: 0; }
  .opts { justify-content: space-between; }
  .size { width: 46px; height: 46px; }
  .mirror { flex: 1; min-width: 0; }
  .palette { grid-template-rows: repeat(2, 42px); grid-auto-columns: 42px; padding: 8px 6px 8px; }
  .swatch { width: 42px; height: 42px; }
  .hint { font-size: 14px; }
}
@media (max-width: 400px) { .logo { font-size: 20px; } .btn { min-width: 42px; padding: 0 6px; } }
@media (prefers-reduced-motion: reduce) {
  .paper.boom, .paper.boom .flash { animation: none; }
  .btn, .tool, .swatch, .logo span { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1 class="logo" id="logo" aria-label="Boom Boom Banana-choo!"></h1>
      <p class="tagline">Addy &amp; Gabby paint</p>
    </div>
    <div class="actions">
      <button class="btn" id="undo" aria-label="Undo" disabled><svg class="ic"><use href="#i-undo"/></svg><span class="lbl">Undo</span></button>
      <button class="btn" id="redo" aria-label="Redo" disabled><svg class="ic" style="transform:scaleX(-1)"><use href="#i-undo"/></svg><span class="lbl">Redo</span></button>
      <button class="btn" id="sound" aria-label="Sound" aria-pressed="true"><svg class="ic"><use id="soundUse" href="#i-sound"/></svg></button>
      <button class="btn" id="photo" aria-label="Take a picture"><svg class="ic"><use href="#i-photo"/></svg><span class="lbl">Photo</span></button>
      <button class="btn boom" id="boom" aria-label="Clear the page"><svg class="ic"><use href="#i-boom"/></svg><span class="lbl">Boom!</span></button>
    </div>
  </header>

  <nav class="tools" id="tools" aria-label="Tools"></nav>

  <main class="stage">
    <div class="paper" id="paper">
      <canvas id="cv" aria-label="Drawing paper"></canvas>
      <div class="hint" id="hint">Pick a tool and scribble on the page!</div>
      <div class="flash"></div>
    </div>
    <div class="tray" id="tray" hidden></div>
  </main>

  <footer class="bottom">
    <div class="opts">
      <div class="opts" id="sizes" role="group" aria-label="Brush size"></div>
      <button class="btn mirror" id="mirror" data-on="false" aria-label="Mirror drawing"><svg class="ic"><use href="#i-mirror"/></svg><span id="mirrorLbl">Mirror off</span></button>
    </div>
    <div class="palette" id="palette" role="group" aria-label="Colors"></div>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-label="Your picture">
    <img id="photoImg" alt="Your drawing">
    <p>Press and hold the picture to save it. On a computer, right-click it.</p>
    <button class="btn" id="closeModal" style="background:var(--sun)">Keep drawing</button>
  </div>
</div>

    drawing = true; pid = e.pointerId; last = p;
    st = { acc: 0, hue: rnd() * 360, moved: false, start: p };
    try { cv.setPointerCapture(pid); } catch (err) {}
    if (isShape()) {
      baseCv = document.createElement('canvas'); baseCv.width = cv.width; baseCv.height = cv.height;
      baseCv.getContext('2d').drawImage(cv, 0, 0);
    } else {
      stroke(p, { x: p.x + 0.01, y: p.y }, true);
      if (state.tool === 'spray') {
        sprayTimer = setInterval(function () { if (last) sprayAt(last.x, last.y); }, 18);
      }
    }
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing || e.pointerId !== pid) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [], i, p;
    if (!evs.length) evs = [e];
    for (i = 0; i < evs.length; i++) {
      p = pt(evs[i]);
      if (isShape()) { st.moved = true; restoreBase(); drawShape(st.start, p); }
      else stroke(last, p, false);
      last = p;
    }
  });
  function endStroke(e) {
    if (!drawing || (e && e.pointerId !== pid)) return;
    if (isShape()) {
      if (!st.moved) {
        var s = st.start, off = 70; restoreBase();
        drawShape({ x: s.x - off / 2, y: s.y - off / 2 }, { x: s.x + off / 2, y: s.y + off / 2 });
        if (state.tool === 'line') { restoreBase(); drawShape({ x: s.x - off / 2, y: s.y + off / 2 }, { x: s.x + off / 2, y: s.y - off / 2 }); }
      }
      tone(480, 0.1, 'sine', 0.12, 1.7);
      baseCv = null;
    }
    clearInterval(sprayTimer); sprayTimer = null;
    try { cv.releasePointerCapture(pid); } catch (err) {}
    drawing = false; pid = null;
  }
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);

  /* ---------- wacky effects ---------- */
  function runEffect(id) {
    pushUndo();
    var w = cv.width, h = cv.height, src, dst, s32, d32, x, y, i, f, th, c, sn, dx, dy, r, sx, sy, R, cx, cy, tmp, tc, blk, rr, d, px;
    if (id === 'swirl') {
      src = ctx.getImageData(0, 0, w, h); dst = ctx.createImageData(w, h);
      s32 = new Uint32Array(src.data.buffer); d32 = new Uint32Array(dst.data.buffer);
      cx = w / 2; cy = h / 2; R = Math.min(w, h) * 0.6;
      for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
        i = y * w + x; dx = x - cx; dy = y - cy; r = Math.sqrt(dx * dx + dy * dy);
        if (r >= R) { d32[i] = s32[i]; continue; }
        f = 1 - r / R; th = f * f * 4.5; c = Math.cos(th); sn = Math.sin(th);
        sx = Math.round(cx + dx * c - dy * sn); sy = Math.round(cy + dx * sn + dy * c);
        if (sx < 0) sx = 0; else if (sx >= w) sx = w - 1;
        if (sy < 0) sy = 0; else if (sy >= h) sy = h - 1;
        d32[i] = s32[sy * w + sx];
      }
      ctx.putImageData(dst, 0, 0);
      tone(200, 0.6, 'sawtooth', 0.06, 4);
    } else if (id === 'scatter') {
      src = ctx.getImageData(0, 0, w, h); dst = ctx.createImageData(w, h);
      s32 = new Uint32Array(src.data.buffer); d32 = new Uint32Array(dst.data.buffer);
      rr = Math.round(7 * dpr);
      for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
        sx = x + Math.round((rnd() - 0.5) * 2 * rr); sy = y + Math.round((rnd() - 0.5) * 2 * rr);
        if (sx < 0) sx = 0; else if (sx >= w) sx = w - 1;
        if (sy < 0) sy = 0; else if (sy >= h) sy = h - 1;
        d32[y * w + x] = s32[sy * w + sx];
      }
      ctx.putImageData(dst, 0, 0);
      noise(0.5, 0.18, 3000);
    } else if (id === 'flip') {
      tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h; tmp.getContext('2d').drawImage(cv, 0, 0);
      ctx.save(); ctx.setTransform(-1, 0, 0, 1, w, 0); ctx.clearRect(0, 0, w, h); ctx.drawImage(tmp, 0, 0); ctx.restore();
      tone(700, 0.18, 'triangle', 0.12, 0.4);
    } else if (id === 'chunky') {
      blk = Math.max(2, Math.round(11 * dpr));
      tmp = document.createElement('canvas'); tmp.width = Math.ceil(w / blk); tmp.height = Math.ceil(h / blk);
      tc = tmp.getContext('2d'); tc.drawImage(cv, 0, 0, tmp.width, tmp.height);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmp, 0, 0, tmp.width, tmp.height, 0, 0, tmp.width * blk, tmp.height * blk); ctx.restore();
      tone(330, 0.12, 'square', 0.07); setTimeout(function () { tone(440, 0.12, 'square', 0.07); }, 110);
    } else if (id === 'invert') {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.restore();
      src = ctx.getImageData(0, 0, w, h); d = src.data;
      for (px = 0; px < d.length; px += 4) { d[px] = 255 - d[px]; d[px + 1] = 255 - d[px + 1]; d[px + 2] = 255 - d[px + 2]; }
      ctx.putImageData(src, 0, 0);
      tone(880, 0.25, 'sine', 0.1, 0.35);
    }
  }

  /* ---------- header buttons ---------- */
  $('#boom').addEventListener('click', function () {
    pushUndo();
    paper.classList.remove('boom'); void paper.offsetWidth; paper.classList.add('boom');
    noise(0.7, 0.4, 500); tone(110, 0.5, 'sawtooth', 0.14, 0.3);
    setTimeout(function () { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); }, 120);
    setTimeout(function () { paper.classList.remove('boom'); }, 520);
    hint.hidden = true; closeTray();
  });
  $('#sound').addEventListener('click', function () {
    state.sound = !state.sound;
    $('#sound').setAttribute('aria-pressed', state.sound ? 'true' : 'false');
    $('#soundUse').setAttribute('href', state.sound ? '#i-sound' : '#i-mute');
    if (state.sound) tone(660, 0.1, 'sine', 0.12);
  });
  $('#mirror').addEventListener('click', function () { state.mirror = (state.mirror + 1) % 3; refreshUI(); tone(500 + state.mirror * 150, 0.1, 'triangle', 0.1); });
  $('#photo').addEventListener('click', function () {
    var t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height;
    var c = t.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, t.width, t.height); c.drawImage(cv, 0, 0);
    try { $('#photoImg').src = t.toDataURL('image/png'); } catch (err) { return; }
    $('#modal').hidden = false; closeTray();
    tone(1200, 0.05, 'square', 0.08); setTimeout(function () { tone(900, 0.12, 'square', 0.08); }, 70);
  });
  function closeModal() { $('#modal').hidden = true; }
  $('#closeModal').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', function (e) { if (e.target === $('#modal')) closeModal(); });

  refreshUI(); updUR();
})();
</script>
